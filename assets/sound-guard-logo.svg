<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sound Guard Logo</title>
  <desc id="desc">A shield combined with microphone and sound waves representing decibel monitoring and threshold alerts.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1d2a"/>
      <stop offset="100%" stop-color="#12344a"/>
    </linearGradient>

    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f5f7a"/>
      <stop offset="100%" stop-color="#0d3448"/>
    </linearGradient>

    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="60%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <path
    d="M256 72 L388 124 V236 C388 329 327 411 256 448 C185 411 124 329 124 236 V124 Z"
    fill="url(#shield)"
    stroke="#68b9d6"
    stroke-width="10"
  />

  <path
    d="M256 113 L347 149 V230 C347 297 305 357 256 387 C207 357 165 297 165 230 V149 Z"
    fill="none"
    stroke="#9cd8ec"
    stroke-opacity="0.35"
    stroke-width="6"
  />

  <rect x="176" y="308" width="160" height="18" rx="9" fill="#0a2635"/>
  <rect x="176" y="308" width="112" height="18" rx="9" fill="url(#meter)"/>

  <g fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M198 236 C198 257 215 274 236 274 C257 274 274 257 274 236 V188 C274 167 257 150 236 150 C215 150 198 167 198 188 Z"
      fill="#bde9f8" stroke="#d9f4ff" stroke-width="6"/>
    <path d="M236 274 V302" stroke="#d9f4ff" stroke-width="10"/>
    <path d="M214 302 H258" stroke="#d9f4ff" stroke-width="10"/>

    <path d="M301 178 C323 194 323 229 301 245" stroke="#5ed2ff" stroke-width="8"/>
    <path d="M324 159 C354 184 354 239 324 264" stroke="#f1c40f" stroke-width="8"/>
    <path d="M347 141 C385 173 385 250 347 282" stroke="#e74c3c" stroke-width="8"/>
  </g>

  <circle cx="288" cy="317" r="6" fill="#f6d86b"/>
  <circle cx="306" cy="317" r="6" fill="#e88b5f"/>
</svg>
