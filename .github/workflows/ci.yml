name: Build WPF Application

on:
  pull_request:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish single-file exe (win-x64)
        run: dotnet publish src/SoundMonitor/SoundMonitor.csproj --configuration ${{ env.CONFIGURATION }} --output ./dist/single-exe-win-x64 --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false

      - name: Upload single-file exe artifact
        uses: actions/upload-artifact@v7
        with:
          path: ./dist/single-exe-win-x64/SoundMonitor.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

  comment-pr-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Comment artifact links to PR
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- sound-guard-artifacts -->';

            let lines = ['- No artifacts found in this run.'];
            try {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });

              const artifacts = data.artifacts || [];
              const targetArtifactNames = [
                'SoundMonitor.exe',
              ];

              const targetArtifacts = targetArtifactNames
                .map(name => artifacts.find(a => a.name === name))
                .filter(Boolean);

              lines = targetArtifacts.length
                ? targetArtifacts.map(a => `- [${a.name}](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${a.id}) (expires: ${a.expires_at})`)
                : ['- Target executable artifacts are not found in this run.'];
            } catch (error) {
              lines = [
                '- Unable to list artifacts in this context (token permission is limited).',
                '- Open the workflow run page to download artifacts directly.',
              ];
              core.warning(`Artifact listing skipped: ${error?.message || error}`);
            }

            const body = [
              marker,
              '### Build Artifacts',
              '',
              ...lines,
            ].join('\n');

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Unable to post PR artifact comment: ${error?.message || error}`);
            }
