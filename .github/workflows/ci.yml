name: Build WPF Application

on:
  pull_request:

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore SoundMonitor.csproj

      - name: Build
        run: dotnet build SoundMonitor.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Publish self-contained single-file (win-x64)
        run: dotnet publish SoundMonitor.csproj --configuration ${{ env.CONFIGURATION }} --output ./publish-win-x64 --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer executable
        shell: pwsh
        run: |
          $content = Get-Content -Raw "SoundMonitor.csproj"
          $versionMatch = [regex]::Match($content, '<Version>([^<]+)</Version>')
          if (-not $versionMatch.Success) {
            throw "Version not found in SoundMonitor.csproj"
          }

          $version = $versionMatch.Groups[1].Value.Trim()
          $iss = @"
          #define MyAppName "SoundMonitor"
          #define MyAppVersion "$version"
          #define MyAppExeName "SoundMonitor.exe"

          [Setup]
          AppId={{A0AEE4E7-DA06-4688-87E2-42F11F66B4E8}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir=artifacts
          OutputBaseFilename=SoundMonitor-win-x64-setup
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "publish-win-x64\SoundMonitor.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch SoundMonitor"; Flags: nowait postinstall skipifsilent
          "@

          Set-Content -Path ./installer.iss -Value $iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ./installer.iss

      - name: Package executable artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts -Force | Out-Null
          Copy-Item ./publish-win-x64/SoundMonitor.exe ./artifacts/SoundMonitor-win-x64-self-contained.exe -Force

      - name: Upload self-contained exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoundMonitor-win-x64-self-contained.exe
          path: ./artifacts/SoundMonitor-win-x64-self-contained.exe
          retention-days: 30

      - name: Upload installer exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoundMonitor-win-x64-setup.exe
          path: ./artifacts/SoundMonitor-win-x64-setup.exe
          retention-days: 30

  comment-pr-artifacts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Comment artifact links to PR
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- sound-guard-artifacts -->';

            let lines = ['- No artifacts found in this run.'];
            try {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });

              const artifacts = data.artifacts || [];
              const targetArtifactNames = [
                'SoundMonitor-win-x64-self-contained.exe',
                'SoundMonitor-win-x64-setup.exe',
              ];

              const targetArtifacts = targetArtifactNames
                .map(name => artifacts.find(a => a.name === name))
                .filter(Boolean);

              lines = targetArtifacts.length
                ? targetArtifacts.map(a => `- [${a.name}](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${a.id}) (expires: ${a.expires_at})`)
                : ['- Target executable artifacts are not found in this run.'];
            } catch (error) {
              lines = [
                '- Unable to list artifacts in this context (token permission is limited).',
                '- Open the workflow run page to download artifacts directly.',
              ];
              core.warning(`Artifact listing skipped: ${error?.message || error}`);
            }

            const body = [
              marker,
              '### Build Artifacts',
              '',
              ...lines,
            ].join('\n');

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Unable to post PR artifact comment: ${error?.message || error}`);
            }
